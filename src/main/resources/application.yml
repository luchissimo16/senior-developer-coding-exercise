spring:
  application:
    name: ec-temp-int
  datasource:
    url: jdbc:h2:mem:elemental-int;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ec
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  http:
    client:
      connect-timeout: 2s
      read-timeout: 3s

ip-api:
  base-url: http://ip-api.com

ip-validation:
  blocked-countries:
    - CN
    - ES
    - US
  blocked-providers:
    - AWS
    - GCP
    - Azure

resilience4j:
  retry:
    instances:
      ipApi:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

logging:
  level:
    org.hibernate.SQL: info
